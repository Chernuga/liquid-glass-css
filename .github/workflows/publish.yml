name: Publish (npm, optional)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing (no NPM_TOKEN needed)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5.1 (trusted publishing)
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package=$PKG_VERSION tag=$TAG"
          test "$PKG_VERSION" = "$TAG"

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Authenticates via OIDC against the trusted publisher configured on
      # npmjs.com (Chernuga / liquid-glass-css / publish.yml).
      # Requires "Allow npm publish" on that configuration; otherwise use
      # `npm stage publish` and approve the staged version in the npm UI.
      - name: Publish to npm (trusted publishing)
        run: npm publish --access public
